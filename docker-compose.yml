# Production-style stack: MongoDB + API + customer frontend + admin panel
#   docker compose up -d --build
name: food-delivery

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  mongodb:
    image: mongo:6.0
    container_name: food_mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:?Set MONGO_PASSWORD in .env (copy .env.example)}
      MONGO_INITDB_DATABASE: ${MONGO_DB:-fooddb}
    # Bound to localhost only - the database is NOT exposed to the network
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongodb_data:/data/db
      - mongodb_config:/data/configdb
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    logging: *default-logging
    networks: [food-network]

  backend:
    image: ${IMAGE_NAMESPACE:-foodapp}/backend:${IMAGE_TAG:-latest}
    build:
      context: ./backend
      target: runtime
    container_name: food_backend
    restart: unless-stopped
    depends_on:
      mongodb:
        condition: service_healthy
    ports:
      - "4000:4000"
    environment:
      PORT: 4000
      NODE_ENV: ${NODE_ENV:-production}
      MONGO_URI: mongodb://${MONGO_USER:-admin}:${MONGO_PASSWORD}@mongodb:27017/${MONGO_DB:-fooddb}?authSource=admin
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env (copy .env.example)}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
    volumes:
      # Named volume (seeded from the image's sample images on first start)
      - uploads_data:/app/uploads
    logging: *default-logging
    networks: [food-network]

  frontend:
    image: ${IMAGE_NAMESPACE:-foodapp}/frontend:${IMAGE_TAG:-latest}
    build:
      context: ./frontend
      target: runtime
    container_name: food_frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "3000:80"
    environment:
      API_URL: ${API_URL:-http://localhost:4000}
    logging: *default-logging
    networks: [food-network]

  admin:
    image: ${IMAGE_NAMESPACE:-foodapp}/admin:${IMAGE_TAG:-latest}
    build:
      context: ./admin
      target: runtime
    container_name: food_admin
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "3001:80"
    environment:
      API_URL: ${API_URL:-http://localhost:4000}
    logging: *default-logging
    networks: [food-network]

networks:
  food-network:
    driver: bridge

volumes:
  mongodb_data:
  mongodb_config:
  uploads_data:
